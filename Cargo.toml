[package]
name = "manga-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rayon = "1.12.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2.0.21"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

# 依存（画像復号・egui）を dev でも最適化する。p0-14 の実測で、debug のままだと
# 1 頁の復号が 440 ms 級（release は 11 ms 級）になり、`cargo run` の体感が遅かった。
[profile.dev.package."*"]
opt-level = 3
